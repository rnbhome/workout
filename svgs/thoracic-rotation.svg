<path d="M 72 22 Q 76 26 78 32" fill="none" stroke="#2a1a0c" stroke-width="0.5"/>
<path d="M 80 18 Q 84 22 86 28" fill="none" stroke="#2a1a0c" stroke-width="0.5"/>
<path d="M 78 36 Q 82 38 84 42" fill="none" stroke="#3d2817" stroke-width="0.8"/>
<path d="M 72 44 Q 70 50 72 56" fill="none" stroke="#3d2817" stroke-width="2"/>
</g>
</g>

<!-- torso (curved, on all fours) -->
<path d="M 50 152 C 70 142, 110 142, 150 152 L 152 175 C 110 175, 70 175, 48 178 Z" fill="url(#shirt)"/>
<path d="M 52 156 Q 100 148 150 158" fill="none" stroke="url(#shirtHi)" stroke-width="2" opacity="0.5"/>
<path d="M 48 178 Q 100 175 152 175" fill="none" stroke="url(#shirtDark)" stroke-width="2"/>
<path d="M 100 152 Q 100 162 100 174" stroke="url(#shirtDark)" stroke-width="0.6" opacity="0.4" fill="none"/>

<!-- shorts -->
<path d="M 150 152 Q 175 156 175 178 L 150 178 Z" fill="url(#shorts)"/>
<rect x="148" y="150" width="27" height="2.5" fill="#0a0a0a"/>
<line x1="150" y1="178" x2="175" y2="178" stroke="#0a0a0a" stroke-width="1.5"/>

<!-- supporting arm down -->
<path d="M 50 154 Q 46 180 48 220 L 60 222 Q 62 180 64 154 Z" fill="url(#skin)"/>
<ellipse cx="52" cy="222" rx="9" ry="4" fill="url(#skinShadow)"/>
<path d="M 44 222 L 64 222 L 64 252 L 44 252 Z" fill="url(#skin)"/>
<ellipse cx="54" cy="252" rx="14" ry="3" fill="#1a1a1a"/>

<!-- back legs (kneeling) -->
<path d="M 152 162 L 175 252 L 195 252 L 178 158 Z" fill="url(#skin)" opacity="0.85"/>
<ellipse cx="186" cy="220" rx="4" ry="14" fill="url(#skinHi)" opacity="0.4" transform="rotate(15 186 220)"/>
<ellipse cx="180" cy="252" rx="14" ry="3" fill="#1a1a1a"/>
<path d="M 168 248 L 194 248 L 196 252 L 168 252 Z" fill="url(#shoe)"/>
<!-- second leg behind -->
<path d="M 138 162 L 158 252 L 175 252 L 162 158 Z" fill="url(#skin)" opacity="0.55"/>

<!-- raised arm reaching UP -->
<ellipse cx="92" cy="142" rx="11" ry="9" fill="url(#skin)" transform="rotate(-30 92 142)"/>
<path d="M 90 134 Q 92 100 88 60 L 100 56 Q 102 98 102 138 Z" fill="url(#skin)"/>
<ellipse cx="93" cy="98" rx="14" ry="4" fill="url(#skinHi)" opacity="0.5"/>
<ellipse cx="94" cy="58" rx="7" ry="5" fill="url(#skinShadow)"/>
<path d="M 88 60 Q 86 30 84 12 L 100 10 Q 102 28 100 56 Z" fill="url(#skin)"/>
<ellipse cx="92" cy="32" rx="5" ry="14" fill="url(#skinHi)" opacity="0.5"/>
<!-- hand at top -->
<path d="M 84 12 Q 80 0 92 -2 L 102 4 Q 100 14 92 16 Z" fill="url(#skin)"/>
<ellipse cx="86" cy="-2" rx="0.7" ry="0.5" fill="#f4cba6"/>
<ellipse cx="89" cy="-3" rx="0.7" ry="0.5" fill="#f4cba6"/>
<line x1="86" y1="0" x2="84" y2="6" stroke="#a07550" stroke-width="0.4"/>
<line x1="89" y1="-2" x2="88" y2="6" stroke="#a07550" stroke-width="0.4"/>

<!-- ghost hand at start (down, behind supporting arm) -->
<g opacity="0.4">
<ellipse cx="40" cy="240" rx="6" ry="8" fill="url(#skinShadow)"/>
</g>
<text x="20" y="235" font-size="9" fill="#999" font-style="italic" font-family="Georgia">start</text>
<text x="108" y="8" font-size="9" fill="#b85440" font-style="italic" font-family="Georgia" font-weight="bold">end</text>

<!-- trajectory arrow: from down-low up to overhead -->

<path d="M 40 235 C 30 180 80 80 92 30" fill="none" stroke="#d4906a" stroke-width="2.5" stroke-dasharray="6,5" opacity="0.5" stroke-linecap="round"/>
<polygon points="85,38 92,22 100,38" fill="#d4906a" opacity="0.55"/>
</svg>
