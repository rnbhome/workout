<circle cx="90.3" cy="55" r="0.7" fill="#0a0a0a"/>
<circle cx="90.6" cy="54.5" r="0.4" fill="#fff"/>
<path d="M 86 53 Q 89 52 92 53" fill="none" stroke="#2a1810" stroke-width="0.6"/>
<line x1="87" y1="53" x2="87" y2="51" stroke="#1a0a05" stroke-width="0.4"/>
<line x1="89" y1="52.8" x2="89" y2="50.6" stroke="#1a0a05" stroke-width="0.4"/>
<line x1="91" y1="53" x2="91.5" y2="51" stroke="#1a0a05" stroke-width="0.4"/>
<path d="M 86 56 Q 89 57 92 56" fill="none" stroke="#7a5040" stroke-width="0.4"/>
<path d="M 84 49 Q 89 47 93 50" fill="none" stroke="#3d2817" stroke-width="2" stroke-linecap="round"/>
